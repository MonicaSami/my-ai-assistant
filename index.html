<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لونا — مساعدتك الشخصية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0d0f14;
    --surface: #161922;
    --surface2: #1e2330;
    --accent: #c9a96e;
    --accent2: #e8c98a;
    --text: #e8e6e0;
    --text-muted: #7a7a8a;
    --user-bubble: #1e2a3a;
    --ai-bubble: #1a1e2a;
    --border: rgba(201,169,110,0.15);
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Background pattern */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 20% 20%, rgba(201,169,110,0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(100,120,200,0.04) 0%, transparent 50%);
    pointer-events: none;
  }

  /* Header */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    backdrop-filter: blur(10px);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--accent), #a07840);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    box-shadow: 0 4px 12px rgba(201,169,110,0.3);
  }

  .logo-text h1 {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
  }

  .logo-text p {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 300;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #4caf7d;
    box-shadow: 0 0 6px #4caf7d;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  .icon-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 36px;
    height: 36px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.2s;
  }

  .icon-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(201,169,110,0.08);
  }

  /* Chat area */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* Welcome screen */
  .welcome {
    text-align: center;
    margin: auto;
    padding: 40px 20px;
    animation: fadeIn 0.6s ease;
  }

  .welcome-icon {
    font-size: 64px;
    margin-bottom: 20px;
    display: block;
    filter: drop-shadow(0 0 20px rgba(201,169,110,0.4));
  }

  .welcome h2 {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .welcome p {
    font-size: 15px;
    color: var(--text-muted);
    line-height: 1.8;
    max-width: 320px;
    margin: 0 auto 28px;
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    max-width: 500px;
    margin: 0 auto;
  }

  .suggestion {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    font-family: 'Tajawal', sans-serif;
    transition: all 0.2s;
  }

  .suggestion:hover {
    background: rgba(201,169,110,0.1);
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }

  /* Messages */
  .message {
    display: flex;
    gap: 10px;
    animation: slideUp 0.3s ease;
    max-width: 85%;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .message.user {
    flex-direction: row-reverse;
    align-self: flex-start;
  }

  .message.ai {
    align-self: flex-end;
  }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .message.user .avatar {
    background: var(--user-bubble);
    border: 1px solid rgba(255,255,255,0.1);
  }

  .message.ai .avatar {
    background: linear-gradient(135deg, var(--accent), #a07840);
    box-shadow: 0 2px 8px rgba(201,169,110,0.25);
  }

  .bubble {
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.7;
    max-width: 100%;
  }

  .message.user .bubble {
    background: var(--user-bubble);
    border: 1px solid rgba(255,255,255,0.06);
    border-top-right-radius: 4px;
  }

  .message.ai .bubble {
    background: var(--ai-bubble);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }

  .bubble time {
    display: block;
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 6px;
    text-align: left;
  }

  /* Typing indicator */
  .typing {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 14px 16px;
  }

  .typing span {
    width: 7px;
    height: 7px;
    background: var(--accent);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
    opacity: 0.6;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* Input area */
  footer {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 14px 16px;
    flex-shrink: 0;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px 14px;
    transition: border-color 0.2s;
  }

  .input-row:focus-within {
    border-color: rgba(201,169,110,0.4);
  }

  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    font-size: 15px;
    resize: none;
    max-height: 120px;
    line-height: 1.5;
    direction: rtl;
  }

  #input::placeholder { color: var(--text-muted); }

  #sendBtn {
    background: linear-gradient(135deg, var(--accent), #a07840);
    border: none;
    color: #0d0f14;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(201,169,110,0.3);
  }

  #sendBtn:hover { transform: scale(1.05); }
  #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* Memory Panel */
  .panel-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .panel-overlay.open { display: flex; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    width: 100%;
    max-width: 420px;
    box-shadow: var(--shadow);
    animation: fadeIn 0.3s ease;
  }

  .panel h2 {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 6px;
  }

  .panel p {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 20px;
    line-height: 1.6;
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
    font-weight: 500;
  }

  .field input, .field textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    font-size: 14px;
    outline: none;
    direction: rtl;
    transition: border-color 0.2s;
  }

  .field textarea { resize: vertical; min-height: 80px; }

  .field input:focus, .field textarea:focus {
    border-color: rgba(201,169,110,0.4);
  }

  .panel-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  .btn-primary {
    flex: 1;
    background: linear-gradient(135deg, var(--accent), #a07840);
    border: none;
    color: #0d0f14;
    padding: 11px;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    font-size: 14px;
    font-weight: 700;
    transition: opacity 0.2s;
  }

  .btn-primary:hover { opacity: 0.9; }

  .btn-secondary {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 11px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    font-size: 14px;
    transition: all 0.2s;
  }

  .btn-secondary:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: all 0.3s;
    z-index: 200;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">✨</div>
    <div class="logo-text">
      <h1>لونا</h1>
      <p>مساعدتك الشخصية</p>
    </div>
  </div>
  <div class="status">
    <div class="status-dot"></div>
    <span>متصلة</span>
  </div>
  <div class="header-actions">
    <button class="icon-btn" onclick="openMemory()" title="الذاكرة">🧠</button>
    <button class="icon-btn" onclick="clearChat()" title="محادثة جديدة">🗑️</button>
  </div>
</header>

<div id="chat">
  <div class="welcome" id="welcome">
    <span class="welcome-icon">✨</span>
    <h2>أهلاً! أنا لونا</h2>
    <p>مساعدتك الشخصية. بسألي عن أي حاجة — دراسة، شغل، أفكار، أو مجرد دردشة.</p>
    <div class="suggestions">
      <button class="suggestion" onclick="sendSuggestion(this)">ساعديني في التخطيط ليومي 📅</button>
      <button class="suggestion" onclick="sendSuggestion(this)">اشرحيلي موضوع صعب 📚</button>
      <button class="suggestion" onclick="sendSuggestion(this)">محتاجة أفكار إبداعية 💡</button>
      <button class="suggestion" onclick="sendSuggestion(this)">عايزة أتكلم وأفضفض 💬</button>
    </div>
  </div>
</div>

<footer>
  <div class="input-row">
    <textarea id="input" placeholder="اكتبي رسالتك هنا..." rows="1" 
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</footer>

<!-- Memory Panel -->
<div class="panel-overlay" id="memoryPanel">
  <div class="panel">
    <h2>🧠 ذاكرتي</h2>
    <p>قوليلي عن نفسك عشان أتذكرك في كل مرة وأساعدك أحسن!</p>
    <div class="field">
      <label>اسمك إيه؟</label>
      <input type="text" id="memName" placeholder="اسمك هنا...">
    </div>
    <div class="field">
      <label>عايزاني أعرف إيه عنك؟</label>
      <textarea id="memAbout" placeholder="مثال: بدرس هندسة، بحب القهوة، شغالة في التسويق..."></textarea>
    </div>
    <div class="field">
      <label>تفضيلاتك في الردود؟</label>
      <input type="text" id="memPrefs" placeholder="مثال: ردود قصيرة، بالعامية، مع أمثلة...">
    </div>
    <div class="panel-actions">
      <button class="btn-primary" onclick="saveMemory()">✅ احفظي</button>
      <button class="btn-secondary" onclick="closeMemory()">إلغاء</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let messages = [];
  let userProfile = {};
  let isLoading = false;

  // Load saved data
  function init() {
    const saved = localStorage.getItem('luna_profile');
    if (saved) userProfile = JSON.parse(saved);

    const savedMsgs = localStorage.getItem('luna_history');
    if (savedMsgs) {
      messages = JSON.parse(savedMsgs);
      if (messages.length > 0) {
        document.getElementById('welcome').style.display = 'none';
        messages.forEach(m => renderMessage(m.role, m.content, false));
      }
    }
  }

  function getTime() {
    return new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
  }

  function renderMessage(role, content, animate = true) {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = `message ${role}`;
    if (!animate) div.style.animation = 'none';

    div.innerHTML = `
      <div class="avatar">${role === 'user' ? '👤' : '✨'}</div>
      <div class="bubble">
        ${content.replace(/\n/g, '<br>')}
        <time>${getTime()}</time>
      </div>`;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function showTyping() {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'message ai';
    div.id = 'typing';
    div.innerHTML = `
      <div class="avatar">✨</div>
      <div class="bubble typing"><span></span><span></span><span></span></div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function hideTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function sendMessage() {
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text || isLoading) return;

    document.getElementById('welcome').style.display = 'none';
    input.value = '';
    input.style.height = 'auto';
    isLoading = true;
    document.getElementById('sendBtn').disabled = true;

    messages.push({ role: 'user', content: text });
    renderMessage('user', text);
    showTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages, userProfile })
      });

      const data = await res.json();
      hideTyping();

      if (data.error) throw new Error(data.error);

      messages.push({ role: 'assistant', content: data.response });
      renderMessage('ai', data.response);

      // Save last 30 messages
      localStorage.setItem('luna_history', JSON.stringify(messages.slice(-30)));

    } catch (err) {
      hideTyping();
      renderMessage('ai', '⚠️ حصل مشكلة. جربي تاني أو تأكدي من الإعدادات.');
      messages.pop();
    }

    isLoading = false;
    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }

  function sendSuggestion(btn) {
    document.getElementById('input').value = btn.textContent.slice(0, -2).trim();
    sendMessage();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function clearChat() {
    if (!confirm('تمسحي المحادثة الحالية؟')) return;
    messages = [];
    localStorage.removeItem('luna_history');
    const chat = document.getElementById('chat');
    chat.innerHTML = '';
    const welcome = document.createElement('div');
    welcome.className = 'welcome';
    welcome.id = 'welcome';
    welcome.innerHTML = `
      <span class="welcome-icon">✨</span>
      <h2>أهلاً! أنا لونا</h2>
      <p>مساعدتك الشخصية. بسألي عن أي حاجة — دراسة، شغل، أفكار، أو مجرد دردشة.</p>
      <div class="suggestions">
        <button class="suggestion" onclick="sendSuggestion(this)">ساعديني في التخطيط ليومي 📅</button>
        <button class="suggestion" onclick="sendSuggestion(this)">اشرحيلي موضوع صعب 📚</button>
        <button class="suggestion" onclick="sendSuggestion(this)">محتاجة أفكار إبداعية 💡</button>
        <button class="suggestion" onclick="sendSuggestion(this)">عايزة أتكلم وأفضفض 💬</button>
      </div>`;
    chat.appendChild(welcome);
    showToast('✅ محادثة جديدة');
  }

  function openMemory() {
    document.getElementById('memName').value = userProfile.name || '';
    document.getElementById('memAbout').value = userProfile.about || '';
    document.getElementById('memPrefs').value = userProfile.preferences || '';
    document.getElementById('memoryPanel').classList.add('open');
  }

  function closeMemory() {
    document.getElementById('memoryPanel').classList.remove('open');
  }

  function saveMemory() {
    userProfile = {
      name: document.getElementById('memName').value.trim(),
      about: document.getElementById('memAbout').value.trim(),
      preferences: document.getElementById('memPrefs').value.trim()
    };
    localStorage.setItem('luna_profile', JSON.stringify(userProfile));
    closeMemory();
    showToast('✅ اتحفظت الذاكرة!');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  init();
</script>
</body>
</html>
